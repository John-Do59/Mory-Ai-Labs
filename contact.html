<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mory AI Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link href="./assets/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="relative opacity-0 transition-opacity duration-700 ease-in-out">
    <div class="grain"></div>

    <nav class="fixed top-0 w-full z-40 px-6 py-6 transition-all duration-300" id="navbar">
        <div
            class="max-w-screen-2xl mx-auto flex justify-between items-center bg-white/5 backdrop-blur-md rounded-full px-6 py-3 border border-white/10 shadow-lg shadow-black/20">
            <div class="hidden md:flex gap-4 text-sm font-medium opacity-60">
                <span id="time-display">00:00:00</span>
                <span>Lille, FR</span>
            </div>
            <a href="index.html"
                class="absolute left-1/2 -translate-x-1/2 text-2xl font-bold tracking-tighter text-mory-accent drop-shadow-[0_0_10px_rgba(0,255,148,0.5)]">MORY
                AI LABS</a>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-sm font-semibold">
                    <a href="about.html" class="hover:text-mory-accent transition-colors">À Propos</a>
                    <a href="services.html" class="hover:text-mory-highlight transition-colors">Services</a>
                </div>
                <!-- Active State -->
                <a href="#"
                    class="flex items-center gap-2 bg-mory-accent text-mory-bg px-5 py-2 rounded-full text-sm font-bold shadow-[0_0_15px_rgba(0,255,148,0.3)]">
                    <span>Discutons</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-6 min-h-screen flex flex-col justify-center">
        <div class="max-w-screen-lg mx-auto w-full">
            <h1 class="text-6xl md:text-8xl mb-12 text-reveal-container">
                <span class="block text-reveal active delay-100">LANCEZ UN</span>
                <span class="block text-reveal active delay-200 text-mory-highlight">PROJET.</span>
            </h1>

            <div class="grid md:grid-cols-2 gap-16 mt-24">
                <div class="reveal-on-scroll">
                    <p class="text-xl text-mory-secondary mb-8">Intéressé par une collaboration ? Remplissez le
                        formulaire ou envoyez-nous un email.</p>
                    <div class="mb-12">
                        <a href="mailto:rammanatamaury@gmail.com"
                            class="text-2xl font-bold hover:text-mory-accent transition-colors underline decoration-2 underline-offset-4 decoration-mory-accent">rammanatamaury@gmail.com</a>

                        <div class="mt-8">
                            <p class="text-mory-secondary mb-3">ou prenez contact sur LinkedIn :</p>
                            <a href="https://www.linkedin.com/in/amaury-dev-data-ia/" target="_blank"
                                rel="noopener noreferrer"
                                class="flex items-center gap-3 text-lg font-bold text-white hover:text-mory-highlight transition-colors w-fit group">
                                <i data-lucide="linkedin"
                                    class="w-5 h-5 text-mory-highlight group-hover:scale-110 transition-transform"></i>
                                <span>amaury-dev-data-ia</span>
                            </a>
                        </div>
                    </div>

                    <div class="mt-12 space-y-4">
                        <h3 class="text-sm font-bold uppercase tracking-widest opacity-50 text-mory-accent">Bureau</h3>
                        <p class="text-lg">Le Labo<br>Simplon<br>59000 Lille, France</p>
                    </div>
                </div>

                <!-- Form -->
                <form class="space-y-8 reveal-on-scroll" style="transition-delay: 200ms">
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-sm font-bold uppercase tracking-widest opacity-50 text-mory-highlight">Nom</label>
                        <input type="text" placeholder="John Doe"
                            class="bg-transparent border-b border-white/20 py-4 focus:outline-none focus:border-mory-accent transition-colors text-lg text-white placeholder-white/20">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-sm font-bold uppercase tracking-widest opacity-50 text-mory-highlight">Email</label>
                        <input type="email" placeholder="john@entreprise.com"
                            class="bg-transparent border-b border-white/20 py-4 focus:outline-none focus:border-mory-accent transition-colors text-lg text-white placeholder-white/20">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label
                            class="text-sm font-bold uppercase tracking-widest opacity-50 text-mory-highlight">Message</label>
                        <textarea rows="4" placeholder="Parlez-nous de votre projet..."
                            class="bg-transparent border-b border-white/20 py-4 focus:outline-none focus:border-mory-accent transition-colors text-lg text-white placeholder-white/20 resize-none"></textarea>
                    </div>
                    <button type="button"
                        class="bg-mory-accent text-mory-bg px-8 py-4 rounded-full font-bold hover:bg-mory-highlight hover:text-white transition-all duration-300 w-full md:w-auto shadow-[0_0_20px_rgba(0,255,148,0.2)] hover:shadow-[0_0_25px_rgba(255,127,63,0.3)]">
                        Envoyer la Demande
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="./src/js/main.js"></script>
    <script>
        lucide.createIcons();
        window.onload = () => document.body.classList.remove('opacity-0');
    </script>
</body>

</html>
